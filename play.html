<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>קו האש: שלב</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;800&display=swap">
<style>
/* במה אחת במסך מלא, שני קנבסים זה על זה, מסכים צפים מעל. עיצוב כהה אחד בכוונה */
:root { --bg: #0b0d0a; --panel: rgba(16,18,14,0.86); --line: #3a3326; --ink: #f1e9d8; --mute: #b0a68c; --amber: #e0a84a; --display: "Karantina", "Assistant", Impact, sans-serif; --body: "Assistant", "Segoe UI", Arial, sans-serif; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #000; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; }
#gl, #hud { grid-area: 1 / 1; display: block; }
#hud { touch-action: none; }
#hud.playing { cursor: none; }
.screen { position: fixed; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
#loading { background: radial-gradient(800px 400px at 50% 40%, #2a1e10, #070806); }
.load { display: grid; gap: 14px; width: min(420px, 100%); text-align: center; }
.load h1 { font-family: var(--display); font-size: 110px; line-height: 0.85; margin: 0; color: var(--ink); font-weight: 400; }
.load h1 span { color: var(--amber); }
.barbox { height: 6px; background: #2a241a; border-radius: 3px; overflow: hidden; }
#bar { height: 100%; width: 0; background: var(--amber); transition: width .2s; }
#load-text { color: var(--mute); font-size: 15px; }
#brief, #end { background: linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.65)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: grid; gap: 16px; width: min(760px, 100%); box-sizing: border-box; backdrop-filter: blur(6px); }
.brief-top { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; }
.brief-top img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; border: 2px solid var(--amber); }
.eyebrow { color: var(--amber); font-weight: 800; letter-spacing: 0.14em; font-size: 14px; }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(56px, 10vw, 92px); line-height: 0.85; margin: 4px 0 0; text-wrap: balance; }
.from { color: var(--amber); font-weight: 800; font-size: 14px; letter-spacing: 0.06em; }
#brief-text { font-size: 19px; line-height: 1.65; min-height: 5em; margin: 0; }
.keys { color: var(--mute); font-size: 15px; }
.keys kbd { font-family: var(--body); font-weight: 800; color: var(--ink); background: #1a1812; border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { appearance: none; border: 0; cursor: pointer; padding: 14px 28px; font: 800 18px var(--body); background: var(--amber); color: #15110a; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--ink); clip-path: none; box-shadow: inset 0 0 0 2px var(--line); text-decoration: none; display: inline-block; }
.stars { font-size: 44px; letter-spacing: 6px; } .star { color: #4a4434; } .star.on { color: #ffd85a; text-shadow: 0 0 18px rgba(255,216,90,0.5); }
#end-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.stat span { color: var(--mute); } .stat b { font-variant-numeric: tabular-nums; }
.diffrow { display: grid; gap: 6px; }
.dlabel { color: var(--mute); font-size: 14px; font-weight: 800; letter-spacing: 0.06em; }
.diffpick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.diffpick button { appearance: none; cursor: pointer; text-align: right; display: grid; gap: 2px; padding: 10px 12px; border-radius: 6px; background: rgba(0,0,0,0.35); border: 1px solid var(--line); color: var(--ink); font: inherit; min-width: 0; }
.diffpick button b { font-size: 18px; }
.diffpick button span { font-size: 13px; color: var(--mute); }
.diffpick button[aria-checked="true"] { border-color: var(--amber); background: rgba(224,168,74,0.16); box-shadow: inset 0 0 0 1px var(--amber); }
.diffpick button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (max-width: 520px) { .diffpick button span { display: none; } }
.saveinfo, .pause-text { color: var(--mute); font-size: 16px; margin: 0; line-height: 1.6; }
#pause-btn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 96px); left: max(14px, env(safe-area-inset-left, 0px)); width: 44px; height: 44px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.45); color: #fff; font-size: 16px; cursor: pointer; z-index: 3; }
#end-story { white-space: pre-wrap; font-size: 18px; line-height: 1.6; margin: 0; border-right: 3px solid var(--amber); padding-right: 12px; }
@media (max-width: 640px) { .brief-top { grid-template-columns: 72px 1fr; } .brief-top img { width: 72px; height: 72px; } #end-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .card { padding: 18px; } }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="hud" aria-label="קו האש, מסך המשחק"></canvas></div>

<section class="screen" id="loading">
  <div class="load">
    <h1>קו <span>האש</span></h1>
    <div class="barbox"><div id="bar"></div></div>
    <span id="load-text">טוען...</span>
  </div>
</section>

<section class="screen" id="brief" hidden>
  <div class="card">
    <div class="brief-top">
      <img id="brief-face" alt="המג״ד רפי">
      <div><div class="eyebrow" id="brief-level"></div><h2 id="brief-name"></h2></div>
    </div>
    <div class="diffrow"><span class="dlabel">רמת קושי</span>
      <div class="diffpick" id="diffpick" role="radiogroup" aria-label="רמת קושי">
        <button type="button" role="radio" data-d="easy" aria-checked="false"><b>קל</b><span>7 חיים, הרבה לבבות</span></button>
        <button type="button" role="radio" data-d="normal" aria-checked="true"><b>רגיל</b><span>5 חיים, לבבות מדי פעם</span></button>
        <button type="button" role="radio" data-d="hard" aria-checked="false"><b>קשה</b><span>4 חיים, לבבות נדירים</span></button>
      </div>
    </div>
    <span class="from">המג״ד רפי בקשר:</span>
    <p id="brief-text"></p>
    <div class="actions"><button class="btn" id="resume" hidden>המשך</button><button class="btn" id="go">יציאה לשטח</button><a class="btn ghost" href="index.html">לעמוד הבית</a></div>
    <span class="saveinfo" id="saveinfo" hidden></span>
    <span class="keys"><kbd>קליק</kbd> יורה · <kbd>רווח</kbd> (להחזיק) מחסה · <kbd>R</kbd> טוען · <kbd>1</kbd> עד <kbd>4</kbd> או גלגלת מחליפים נשק · <kbd>Esc</kbd> הפסקה</span>
  </div>
</section>

<section class="screen" id="end" hidden>
  <div class="card">
    <h2 id="end-title"></h2>
    <div class="stars" id="end-stars"></div>
    <div id="end-stats"></div>
    <p id="end-story"></p>
    <div class="actions"><button class="btn" id="next" hidden>לשלב הבא</button><button class="btn" id="retry-cp" hidden>נסה שוב מהאזור הזה</button><button class="btn" id="again">מההתחלה</button><a class="btn ghost" href="index.html">לעמוד הבית</a></div>
  </div>
</section>

<section class="screen" id="pause" hidden>
  <div class="card">
    <h2>הפסקה</h2>
    <p class="pause-text" id="pause-text"></p>
    <div class="actions"><button class="btn" id="p-resume">המשך לשחק</button><button class="btn ghost" id="p-save">שמור וצא לעמוד הבית</button><button class="btn ghost" id="p-restart">התחל את האזור מחדש</button></div>
    <span class="keys"><kbd>Esc</kbd> או <kbd>P</kbd> עוצרים וממשיכים · ההתקדמות נשמרת אוטומטית בתחילת כל אזור</span>
  </div>
</section>
<button id="pause-btn" aria-label="הפסקה" hidden>❚❚</button>

<script src="profile.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/three-post.js"></script>
<script src="audio.js"></script>
<script src="levels67.js"></script>
<script src="voices.js"></script>
<script src="engine3d.js"></script>
<script src="board.js"></script>
<script>
// שולח את התוצאה לטבלת השיאים המשותפת, כשהיא זמינה
window.addEventListener('kav-level-complete', e => { const d = e.detail; window.BOARD && BOARD.submit(String(d.level), d.name, d.score, d.diff); });
</script>
</body>
</html>
